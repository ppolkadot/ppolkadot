<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <style>
    .term { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', Courier, monospace; font-size: 13.5px; fill: #24292f; white-space: pre; }
    .header { fill: #1a7f37; font-weight: bold; }
    .label { fill: #007a60; font-weight: bold; }
    .bar-fill { fill: #1a7f37; }
    .bar-empty { fill: #8c959f; }
    .cursor { fill: #1a7f37; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>

  <rect width="480" height="340" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <g class="term">
    <text x="28" y="46" class="header">[ppolkadot @ github]</text>
    <text x="28" y="64" fill="#8c959f">--------------------------------------</text>
    <text x="28" y="90"><tspan class="label">OS:</tspan> Windows / WASAPI / BLE-Core</text>
    <text x="28" y="114"><tspan class="label">LANGS:</tspan> Rust, JavaScript</text>
    <text x="28" y="138"><tspan class="label">COMMITS (1Y):</tspan> 76 total</text>
    <text x="28" y="162"><tspan class="label">STREAK:</tspan> 4 days <tspan class="bar-fill">██</tspan><tspan class="bar-empty">░░░░░░░░░░░░░</tspan></text>
    <text x="28" y="186"><tspan class="label">STATUS:</tspan> <tspan class="header">[ACTIVE]</tspan> 0x00A4 // streaming_ok</text>

    <text x="28" y="222" class="header">$ git log --oneline -3</text>
    <text x="28" y="244">* 0000000 - awaiting next commit...</text>
    <text x="28" y="266">* 0000000 - awaiting next commit...</text>
    <text x="28" y="288">* 0000000 - awaiting next commit...</text>

    <text x="28" y="318" class="header">$</text>
    <rect x="43" y="305" width="9" height="15" class="cursor" />
  </g>
</svg>