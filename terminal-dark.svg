    <text x="28" y="266">* d2db807 - v3</text>
    <text x="28" y="288">* 24578a0 - Merge branch &apos;main&apos; of https:...</text>

    <text x="28" y="318" class="header">$</text>
    <rect x="43" y="305" width="9" height="15" class="cursor" />
