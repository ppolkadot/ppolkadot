<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <style>
    .term { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', Courier, monospace; font-size: 13.5px; fill: #d8dee9; white-space: pre; }
    .header { fill: #39ff14; font-weight: bold; }
    .label { fill: #00ffcc; font-weight: bold; }
    .bar-fill { fill: #39ff14; }
    .bar-empty { fill: #4c566a; }
    .cursor { fill: #39ff14; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>

  <rect width="480" height="340" rx="10" fill="#090d10" stroke="#1a2b34" stroke-width="2"/>

