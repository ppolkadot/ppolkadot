    <text x="28" y="138"><tspan class="label">COMMITS (1Y):</tspan> 230 total</text>
    <text x="28" y="162"><tspan class="label">STREAK:</tspan> 5 days <tspan class="bar-fill">███</tspan><tspan class="bar-empty">░░░░░░░░░░░░</tspan></text>
